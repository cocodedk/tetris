<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tetris — neon block puzzle in your browser | Cocode</title>
  <meta name="description" content="Play classic Tetris free in your browser: seven pieces, hold, next queue and neon visual effects. Keyboard and touch. No install, no sign-up.">
  <link rel="canonical" href="https://tetris.cocode.dk/">
  <link rel="alternate" hreflang="en" href="https://tetris.cocode.dk/">
  <link rel="alternate" hreflang="fa" href="https://tetris.cocode.dk/fa/">
  <link rel="alternate" hreflang="x-default" href="https://tetris.cocode.dk/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tetris — neon block puzzle in your browser">
  <meta property="og:description" content="Classic Tetris with neon visual effects. Play free in your browser, on keyboard or touch.">
  <meta property="og:url" content="https://tetris.cocode.dk/">
  <meta property="og:image" content="https://tetris.cocode.dk/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="fa_IR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tetris — neon block puzzle in your browser">
  <meta name="twitter:description" content="Classic Tetris with neon visual effects. Play free in your browser, on keyboard or touch.">
  <meta name="twitter:image" content="https://tetris.cocode.dk/og.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Tetris",
    "url": "https://tetris.cocode.dk/",
    "author": { "@type": "Person", "name": "Babak Bandpey", "url": "https://linkedin.com/in/babakbandpey" },
    "publisher": { "@type": "Organization", "name": "Cocode", "url": "https://cocode.dk" },
    "genre": "Puzzle",
    "playMode": "SinglePlayer",
    "inLanguage": "en",
    "gamePlatform": "Web browser",
    "applicationCategory": "Game",
    "image": "https://tetris.cocode.dk/og.png"
  }
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://brand.cocode.dk/v1.css">
  <script type="module" src="https://brand.cocode.dk/v1.js"></script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <cocode-head project="Tetris" accent="#5ee3ff" on-accent="#0b0d1a" dark>
    <a href="https://cocode.dk">cocode.dk</a>
    <span class="on">EN</span>
    <a href="fa/" hreflang="fa">FA</a>
  </cocode-head>
  <main class="game">
    <aside class="side">
      <h2 data-i18n="hold"></h2>
      <canvas id="hold" class="mini hold"></canvas>
      <button type="button" id="hold-btn" class="pad" data-i18n="hold"></button>
      <button type="button" id="pause-btn" class="pad" data-i18n="pause"></button>
    </aside>
    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div id="overlay" class="overlay">
        <section id="screen-start" class="screen">
          <h1 data-i18n="title"></h1>
          <h2 data-i18n="controlsTitle"></h2>
          <ul class="controls">
            <li data-i18n="controlMove"></li>
            <li data-i18n="controlSoft"></li>
            <li data-i18n="controlHard"></li>
            <li data-i18n="controlRotate"></li>
            <li data-i18n="controlHold"></li>
            <li data-i18n="controlPause"></li>
            <li data-i18n="controlTouch"></li>
          </ul>
          <button type="button" id="start-btn" data-i18n="start"></button>
          <button type="button" id="fx-btn" class="toggle"></button>
          <a class="lang" href="fa/" hreflang="fa" lang="fa" data-i18n="otherLanguage"></a>
        </section>
        <section id="screen-pause" class="screen" hidden>
          <h1 data-i18n="paused"></h1>
          <button type="button" id="resume-btn" data-i18n="resume"></button>
        </section>
        <section id="screen-over" class="screen" hidden>
          <h1 data-i18n="gameOver"></h1>
          <p><span data-i18n="score"></span> <b id="final-score"></b></p>
          <p><span data-i18n="best"></span> <b id="best-score"></b></p>
          <button type="button" id="again-btn" data-i18n="playAgain"></button>
        </section>
      </div>
    </div>
    <aside class="side">
      <h2 data-i18n="next"></h2>
      <canvas id="next" class="mini next"></canvas>
      <dl class="stats">
        <dt data-i18n="score"></dt><dd id="score"></dd>
        <dt data-i18n="level"></dt><dd id="level"></dd>
        <dt data-i18n="lines"></dt><dd id="lines"></dd>
      </dl>
    </aside>
  </main>
  <cocode-foot repo="cocodedk/tetris" dark>
    <a href="https://cocode.dk">cocode.dk</a>
  </cocode-foot>
</body>
</html>
